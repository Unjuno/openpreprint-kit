name: Quality and reproducible source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test exact source tree
        shell: bash
        run: |
          set -euo pipefail
          python --version | tee "$RUNNER_TEMP/test-results.txt"
          openssl version | tee -a "$RUNNER_TEMP/test-results.txt"
          python -m unittest discover -s tests -v 2>&1 | tee -a "$RUNNER_TEMP/test-results.txt"
          git archive --format=zip HEAD --output="$RUNNER_TEMP/openpreprint-source.zip"
      - name: Retain tested source and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openpreprint-source.zip
            ${{ runner.temp }}/test-results.txt
          if-no-files-found: error
          retention-days: 14
