name: Quality and reproducible source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test exact source tree
        shell: bash
        run: |
          set -euo pipefail
          python --version | tee "$RUNNER_TEMP/test-results.txt"
          openssl version | tee -a "$RUNNER_TEMP/test-results.txt"
          python -m unittest discover -s tests -v 2>&1 | tee -a "$RUNNER_TEMP/test-results.txt"
          git archive --format=zip HEAD --output="$RUNNER_TEMP/openpreprint-source.zip"
      - name: Retain tested source and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openpreprint-source.zip
            ${{ runner.temp }}/test-results.txt
          if-no-files-found: error
          retention-days: 14
