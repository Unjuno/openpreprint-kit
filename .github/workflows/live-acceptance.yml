name: Live acceptance (synthetic only)

on:
  workflow_dispatch:
  push:
    branches: [feature/completion-20261106]
    paths: [.github/workflows/live-acceptance.yml]

permissions:
  contents: read

concurrency:
  group: opk-live-acceptance
  cancel-in-progress: false

jobs:
  public-tsa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install isolated runtime and collect reproducible dependencies
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/opk-live"
          source "$RUNNER_TEMP/opk-live/bin/activate"
          python -m pip install -r requirements.txt -r requirements-publication-checks.txt wheel typing_extensions
          mkdir -p acceptance/wheels
          python -m pip download --dest acceptance/wheels -r requirements.txt -r requirements-publication-checks.txt wheel typing_extensions
          python -m pip download --dest acceptance/wheels --only-binary=:all: --no-deps --platform manylinux2014_x86_64 --python-version 313 --implementation cp --abi cp313 PyYAML==6.0.3 pyrsistent==0.20.0 charset_normalizer==3.5.2
          python - <<'PY'
          import importlib.metadata as m, json, re, pathlib, urllib.request
          output=pathlib.Path('acceptance')
          lines=[]; build=[]
          for dist in sorted(m.distributions(),key=lambda d:d.metadata['Name'].lower()):
              name=dist.metadata['Name']; version=dist.version
              if name.lower()=='pip': continue
              if not re.fullmatch(r'[A-Za-z0-9_.-]+',name+version): raise ValueError('invalid package name')
              with urllib.request.urlopen(f'https://pypi.org/pypi/{name}/{version}/json',timeout=30) as r:
                  data=json.load(r)
              hashes=sorted({x['digests']['sha256'] for x in data['urls']})
              if not hashes: raise ValueError('missing distribution hashes')
              line=name+'=='+version+' \\\n'+''.join('    --hash=sha256:'+h+(' \\\n' if i<len(hashes)-1 else '\n') for i,h in enumerate(hashes))
              lines.append(line)
              if name.lower() in {'setuptools','wheel','packaging'}: build.append(line)
          (output/'requirements.lock').write_text('# Resolved isolated Python 3.12 environment; all distribution hashes from PyPI.\n'+''.join(lines))
          (output/'requirements-build.lock').write_text('# Bootstrap these before --no-build-isolation installation.\n'+''.join(build))
          PY
      - name: Fetch public trust material and pin official CA
        run: |
          set -euo pipefail
          mkdir -p acceptance/trust
          curl --proto '=https' --tlsv1.2 --fail --max-time 45 https://freetsa.org/files/cacert.pem -o acceptance/trust/ca.pem
          echo '2151b61137ffa86bf664691ba67e7da0b19f98c758e3d228d5d8ebf27e044438  acceptance/trust/ca.pem' | sha256sum -c -
          curl --proto '=https' --tlsv1.2 --fail --max-time 45 https://www.freetsa.org/crl/root_ca.crl -o acceptance/trust/crl.pem
          openssl crl -in acceptance/trust/crl.pem -noout -lastupdate -nextupdate -issuer > acceptance/trust/crl-info.txt
          python - <<'PY'
          import json, pathlib
          p={'schema_version':1,'tsa_url':'https://freetsa.org/tsr','ca_file':'ca.pem','ca_sha256':'2151b61137ffa86bf664691ba67e7da0b19f98c758e3d228d5d8ebf27e044438','crl_file':'crl.pem','policy_oid':'1.2.3.4.1','timeout_seconds':45}
          pathlib.Path('acceptance/trust/policy.json').write_text(json.dumps(p,sort_keys=True,indent=2)+'\n')
          PY
      - name: Real TSA, research versions, tamper checks and recovery
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/opk-live/bin/activate"
          python scripts/acceptance.py live --out acceptance/evidence --policy acceptance/trust/policy.json | tee acceptance/live-report.json
      - name: Retain real evidence even when verification fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-acceptance-${{ github.sha }}
          path: acceptance/
          retention-days: 14
          if-no-files-found: error
