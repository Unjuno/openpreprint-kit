name: Build reader site
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing paper release tag, for example v1'
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build site from release and current notices
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          python -c 'import os,sys; sys.path.insert(0,"scripts"); from research_record import version_ok; sys.exit(0 if version_ok(os.environ["VERSION"]) else 1)'
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded-release
          python scripts/build_site.py downloaded-release --repository "$GITHUB_REPOSITORY" --output site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reader-site
          path: site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
