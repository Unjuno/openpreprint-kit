name: Build reader site
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing paper release tag, for example v1'
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build site from release and current notices
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          python -c 'import os,sys; sys.path.insert(0,"scripts"); from research_record import version_ok; sys.exit(0 if version_ok(os.environ["VERSION"]) else 1)'
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded-release
          python scripts/build_site.py downloaded-release --repository "$GITHUB_REPOSITORY" --output site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-site
          path: site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
