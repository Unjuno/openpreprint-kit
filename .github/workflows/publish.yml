name: Publish preprint release

on:
  workflow_dispatch:
    inputs:
      acknowledge_immutable_enabled:
        description: 'I enabled Settings > General > Releases > Enable release immutability.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: preprint-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Only this manually triggered job may create a draft/publish a Release.
    steps:
      - name: Require explicit preconditions
        env:
          ACKNOWLEDGED: ${{ inputs.acknowledge_immutable_enabled }}
          IS_PRIVATE: ${{ github.event.repository.private }}
          REF_NAME: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$ACKNOWLEDGED" = "true" || { echo 'Confirm the immutable release setting before publishing.' >&2; exit 1; }
          test "$IS_PRIVATE" = "false" || { echo 'Preprints must be published from public repositories.' >&2; exit 1; }
          test "$REF_NAME" = "refs/heads/$DEFAULT_BRANCH" || { echo 'Publish only from the default branch.' >&2; exit 1; }
      - name: Checkout exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test, build, and verify release assets locally
        env:
          PREPRINT_REPOSITORY: ${{ github.repository }}
          PREPRINT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python scripts/prepare_release.py --output dist --repository "$PREPRINT_REPOSITORY" --commit "$PREPRINT_COMMIT"
          python scripts/verify_release.py dist
      - name: Create draft, verify download, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(python -c 'import json; print(json.load(open("dist/preprint-metadata.json", encoding="utf-8"))["version"])')"
          TITLE="$(python -c 'import json; print(" ".join(json.load(open("dist/preprint-metadata.json", encoding="utf-8"))["title"].split()))')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Use a NEW version instead of overwriting it." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. A release cannot reuse a historical tag." >&2
            exit 1
          fi
          gh release create "$TAG" \
            dist/paper.pdf dist/preprint-metadata.json dist/CITATION.cff \
            dist/citation.bib dist/manifest.json dist/SHA256SUMS dist/RELEASE_NOTES.md \
            --draft --target "$GITHUB_SHA" --title "$TITLE ($TAG)" \
            --notes-file dist/RELEASE_NOTES.md
          mkdir -p downloaded-release
          gh release download "$TAG" --dir downloaded-release
          diff -qr dist downloaded-release
          python scripts/verify_release.py downloaded-release
          gh release edit "$TAG" --draft=false
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
