name: First-paper portable launcher smoke (no publication)

on:
  pull_request:
    paths:
      - 'scripts/publish_first_paper.py'
      - 'tests/test_portable_first_paper_launcher.py'
      - 'docs/FIRST_PAPER_QUICKSTART.md'
      - '.github/workflows/portable-first-paper.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/publish_first_paper.py'
      - 'tests/test_portable_first_paper_launcher.py'
      - 'docs/FIRST_PAPER_QUICKSTART.md'
      - '.github/workflows/portable-first-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-smoke:
    name: portable-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read-only plan without platform shell
        run: python scripts/publish_first_paper.py --plan
      - name: Verify byte-exact approved PDF
        run: python scripts/publish_first_paper.py --check-pdf
      - name: Portable launcher regression tests
        run: python -m unittest discover -s tests -p test_portable_first_paper_launcher.py -v
