name: Validate preprint draft

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Record crypto runtime
        run: openssl version
      - name: Validate draft metadata
        run: python scripts/validate.py
      - name: Validate review records and preserve existing history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_record.py
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'New history: no earlier record to compare.'
            exit 0
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          if git cat-file -e "$BASE_SHA:reviews/record.json" 2>/dev/null; then
            git show "$BASE_SHA:reviews/record.json" > "$RUNNER_TEMP/review-baseline.json"
            python scripts/research_record.py --baseline "$RUNNER_TEMP/review-baseline.json"
          fi
      - name: Run unit, RFC 3161 and workflow regression tests
        run: python -m unittest discover -s tests -v
